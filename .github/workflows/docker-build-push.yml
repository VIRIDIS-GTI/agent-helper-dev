# Baut agent-helper-dev und schiebt es nach ghcr.io.
#
# Anders als openclaw-base kein taeglicher Lauf: dieses Image haengt an keiner
# vorgelagerten Quelle, die sich unbemerkt aendern koennte (es baut alles selbst aus
# gepinnten Versionen). Push nach main reicht als Ausloeser.
name: Build & push agent-helper-dev to GHCR

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: viridis-gti/agent-helper-dev

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Rauchtest gegen das eben geschobene Image, aus der Test-Checkliste in der
      # README - kein Docker-Socket im Runner, deshalb ohne den Socket-Teil.
      - name: Rauchtest
        run: |
          IMG=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          docker run --rm "$IMG" bash -lc '
            set -e
            node --version
            pnpm --version
            git --version
            docker --version
            kubectl version --client
            helm version
            terraform version
            echo "Rauchtest bestanden."
          '
